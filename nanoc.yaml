# A list of file extensions that Nanoc will consider to be textual rather than
# binary. If an item with an extension not in this list is found,  the file
# will be considered as binary.
text_extensions: [ 'adoc', 'asciidoc', 'atom', 'coffee', 'css', 'erb', 'haml', 'handlebars', 'hb', 'htm', 'html', 'js', 'less', 'markdown', 'md', 'ms', 'mustache', 'php', 'rb', 'rdoc', 'sass', 'scss', 'slim', 'tex', 'txt', 'xhtml', 'xml' ]

prune:
  auto_prune: true
  exclude: [ '.git' ]

data_sources:
  - type: filesystem
    encoding: utf-8

environments:
  prod:
    base_url: https://melnykov.dev

name: Melnykov
base_url: https://melnykov.dev

# Profile links in the row under the intro, in this order.
# A link with no url is not shown. For email, use a mailto: url.
links:
  - name: github
    url: https://github.com/ignar
  - name: linkedin
    url:
  - name: email
    url:

deploy:
  default:
    kind: git
    remote: git@github.com:ignar/ignar.github.io.git
    branch: gh-pages
    forced: true