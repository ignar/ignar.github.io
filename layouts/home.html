<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title><%= @item[:title] %></title>
    <meta name="description" content="<%= h(@item[:description]) %>">
    <meta name="theme-color" content="#fbfbf9">
    <link rel="canonical" href="<%= @config[:base_url] %>/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="<%= h(@item[:title]) %>">
    <meta property="og:description" content="<%= h(@item[:description]) %>">
    <meta property="og:url" content="<%= @config[:base_url] %>/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap">
    <link rel="stylesheet" href="/stylesheet.css">
    <noscript><style>.figure { display: none; }</style></noscript>
    <script src="/assets/js/figures.js" defer></script>
    <link rel="icon" type="image/png" href="/assets/images/favicon-16x16.png" sizes="16x16">
    <link rel="icon" type="image/png" href="/assets/images/favicon-32x32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="/assets/images/android-chrome-192x192.png" sizes="192x192">
    <link rel="icon" type="image/png" href="/assets/images/android-chrome-512x512.png" sizes="512x512">
    <link rel="apple-touch-icon" sizes="72x72" href="/assets/images/apple-touch-icon.png" >
    <link rel="apple-touch-icon" sizes="114x114" href="/assets/images/apple-touch-icon.png" >
    <link rel="apple-touch-icon" sizes="152x152" href="/assets/images/apple-touch-icon.png" >
</head>
<body>
<div id="top" class="page">
    <header class="site-header">
        <a class="wordmark" href="#top">artem melnykov</a>
        <nav class="site-nav" aria-label="Sections">
            <a href="#about">about</a>
            <a href="#work">what i do</a>
            <a href="#philosophy">philosophy</a>
            <a href="#stack">stack</a>
        </nav>
    </header>

    <div class="figure" data-figure>
        <div class="figure-stage" aria-hidden="true">
            <div class="figure-canvas" data-figure-canvas></div>
        </div>
        <div class="figure-caption">
            <span data-figure-caption></span>
            <button type="button" class="figure-next" data-figure-next aria-label="Show another diagram"><span class="figure-next-text">another diagram </span>↻</button>
        </div>
    </div>

    <main class="main">
        <%= yield %>
    </main>

    <footer class="site-footer">
        <div class="site-footer-inner">
            <span>© <%= Time.now.year %> Artem Melnykov</span>
            <a href="#top"><span class="site-footer-long">back to </span>top ↑</a>
        </div>
    </footer>
</div>
</body>
</html>
